name: CD

# Runs after CI passes on main and promotes the exact image CI tested.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  promote-image:
    name: Promote tested image
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the tested digest as latest
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create \
            --tag "${repo}:latest" \
            --tag "${repo}:sha-${SHA::7}" \
            "${repo}:sha-${SHA}"
          docker buildx imagetools inspect "${repo}:latest"
