name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-build:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit

  validate-k8s:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Render with Kustomize and validate
        run: |
          for dir in k8s k8s/collector; do
            echo "Validating ${dir}"
            kubectl kustomize "${dir}" | kubeconform -strict -summary
          done

  e2e-k8s:
    name: Playwright on Kubernetes
    needs: [lint-build, validate-k8s]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/playwright-k8s.yml
    with:
      push-image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  deploy-pages:
    name: Publish official Playwright report
    needs: e2e-k8s
    # A failed suite is still published: the red report is part of the demo evidence.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.e2e-k8s.result == 'success' || needs.e2e-k8s.result == 'failure')
    # A Pages outage must not turn CI red and block the CD image promotion.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

      - id: deployment
        uses: actions/deploy-pages@v4
