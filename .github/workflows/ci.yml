name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit

  e2e-k8s:
    name: Playwright on Kubernetes
    needs: lint-build
    uses: ./.github/workflows/playwright-k8s.yml

  deploy-pages:
    name: Publish official Playwright report
    needs: e2e-k8s
    # A failed suite is still published: the red report is part of the demo evidence.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.e2e-k8s.result == 'success' || needs.e2e-k8s.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

      - id: deployment
        uses: actions/deploy-pages@v4
