name: CI

on:
  push:
    branches:
      - feature/playwright-ai-framework
  pull_request:

permissions:
  contents: read

jobs:
  qa-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run test:web:dev
      - run: npm run test:api:dev
