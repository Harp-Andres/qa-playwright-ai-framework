name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint-build:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit

  e2e-k8s:
    name: Playwright on Kubernetes
    needs: lint-build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/playwright-k8s.yml
