name: Playwright on Kubernetes

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright on Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run Playwright Job on kind
        run: bash scripts/ci-playwright-k8s.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pod-reports
          path: pod-reports/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report
          path: blob-report/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-artifacts
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
