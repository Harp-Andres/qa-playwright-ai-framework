name: Playwright on Kubernetes

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  e2e:
    name: Playwright on Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run Playwright Job on kind
        run: bash scripts/ci-playwright-k8s.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pod-reports
          path: pod-reports/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report
          path: blob-report/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-artifacts
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

  deploy-pages:
    name: Publish official Playwright report
    needs: e2e
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.e2e.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

      - id: deployment
        uses: actions/deploy-pages@v4
