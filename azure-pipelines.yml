trigger:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'

  - script: npm ci
    displayName: Install dependencies

  - script: npm run lint
    displayName: Lint

  - script: npm run build
    displayName: Type-check

  - script: npm run test:unit
    displayName: Unit tests

  - script: bash scripts/ci-playwright-k8s.sh
    displayName: Run Playwright on Kubernetes

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: 'test-results/**/*.xml'
      failTaskOnFailedTests: true

  - task: PublishPipelineArtifact@1
    condition: always()
    displayName: Publish Playwright HTML report
    inputs:
      targetPath: playwright-report
      artifact: playwright-html-report

  - task: PublishPipelineArtifact@1
    condition: always()
    displayName: Publish per-pod reports
    inputs:
      targetPath: pod-reports
      artifact: pod-reports

  - task: PublishPipelineArtifact@1
    condition: always()
    displayName: Publish test results
    inputs:
      targetPath: test-results
      artifact: test-results

  - task: PublishPipelineArtifact@1
    condition: always()
    displayName: Publish blob report
    inputs:
      targetPath: blob-report
      artifact: blob-report

  - task: PublishPipelineArtifact@1
    condition: always()
    displayName: Publish AI artifacts
    inputs:
      targetPath: artifacts
      artifact: ai-artifacts
