apiVersion: v1
kind: ConfigMap
metadata:
  name: qa-playwright-config
  labels:
    app.kubernetes.io/name: qa-playwright
data:
  TEST_ENV: qa
  SAUCE_BASE_URL: https://www.saucedemo.com
  REQRES_BASE_URL: http://127.0.0.1:4010
  FAKESTORE_BASE_URL: http://127.0.0.1:4010
